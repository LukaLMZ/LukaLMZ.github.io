<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Карта взаимодействий</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; }
  #menu { margin-bottom: 20px; }
  input { margin-right: 10px; }
  svg { border: 1px solid #ccc; }
</style>
</head>
<body>

<h2>Карта взаимодействий</h2>

<div id="menu">
  <h3>Добавить узел</h3>
  <input type="text" id="nodeName" placeholder="Название узла">
  <input type="text" id="nodeGroup" placeholder="Категория">
  <button onclick="addNode()">Добавить узел</button>

  <h3>Добавить связь</h3>
  <input type="text" id="sourceNode" placeholder="Источник">
  <input type="text" id="targetNode" placeholder="Цель">
  <input type="number" id="linkWeight" placeholder="Вес" value="1">
  <button onclick="addLink()">Добавить связь</button>
</div>

<svg width="800" height="600"></svg>

<script>
let nodes = [];
let links = [];

const svg = d3.select("svg");
const width = +svg.attr("width");
const height = +svg.attr("height");

const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(150))
    .force("charge", d3.forceManyBody().strength(-500))
    .force("center", d3.forceCenter(width / 2, height / 2));

const linkGroup = svg.append("g").attr("stroke", "#999").attr("stroke-opacity", 0.6);
const nodeGroup = svg.append("g").attr("stroke", "#fff").attr("stroke-width", 1.5);

function update() {
    // LINKS
    const link = linkGroup.selectAll("line").data(links);
    link.join("line")
        .attr("stroke-width", d => Math.sqrt(d.weight));

    // NODES
    const node = nodeGroup.selectAll("circle").data(nodes, d => d.id);
    node.join("circle")
        .attr("r", 20)
        .attr("fill", d => d3.schemeCategory10[d.group?.length % 10])
        .call(drag(simulation));

    // LABELS
    const labels = nodeGroup.selectAll("text").data(nodes, d => d.id);
    labels.join("text")
        .text(d => d.id)
        .attr("text-anchor", "middle")
        .attr("dy", 4)
        .attr("fill", "#000");

    simulation.nodes(nodes).on("tick", ticked);
    simulation.force("link").links(links);
    simulation.alpha(1).restart();
}

function ticked() {
    linkGroup.selectAll("line")
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

    nodeGroup.selectAll("circle")
        .attr("cx", d => d.x)
        .attr("cy", d => d.y);

    nodeGroup.selectAll("text")
        .attr("x", d => d.x)
        .attr("y", d => d.y);
}

function addNode() {
    const name = document.getElementById("nodeName").value.trim();
    const group = document.getElementById("nodeGroup").value.trim();
    if(name && !nodes.find(n => n.id === name)) {
        nodes.push({id: name, group: group});
        update();
    }
}

function addLink() {
    const source = document.getElementById("sourceNode").value.trim();
    const target = document.getElementById("targetNode").value.trim();
    const weight = parseFloat(document.getElementById("linkWeight").value);
    if(source && target && nodes.find(n => n.id === source) && nodes.find(n => n.id === target)) {
        links.push({source: source, target: target, weight: weight});
        update();
    }
}

function drag(simulation) {
  function dragstarted(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x;
    d.fy = d.y;
  }

  function dragged(event, d) {
    d.fx = event.x;
    d.fy = event.y;
  }

  function dragended(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null;
    d.fy = null;
  }

  return d3.drag()
      .on("start", dragstarted)
      .on("drag", dragged)
      .on("end", dragended);
}

</script>
</body>
</html>
