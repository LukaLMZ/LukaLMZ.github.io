<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Карта взаимодействий</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
  body { font-family: Arial, sans-serif; margin:0; padding:0; background-color:#121212; color:#fff; }
  #menu { padding: 20px; background-color:#1f1f1f; display:flex; flex-wrap: wrap; gap:10px; }
  input, button { padding:5px; margin-right:5px; border-radius:4px; border:none; }
  button { cursor:pointer; background-color:#3b3b3b; color:#fff; }
  button:hover { background-color:#555; }
  svg { width:100vw; height:calc(100vh - 120px); display:block; background-color:#121212; }
  .tooltip { position:absolute; background:#333; color:#fff; padding:4px 8px; border-radius:4px; font-size:12px; pointer-events:none; opacity:0; transition:0.2s; }
</style>
</head>
<body>

<div id="menu">
  <div>
    <h3>Добавить узел</h3>
    <input type="text" id="nodeName" placeholder="Название узла">
    <input type="text" id="nodeGroup" placeholder="Категория">
    <button onclick="addNode()">Добавить</button>
  </div>

  <div>
    <h3>Удалить узел</h3>
    <input type="text" id="deleteNodeName" placeholder="Название узла">
    <button onclick="deleteNode()">Удалить</button>
  </div>

  <div>
    <h3>Добавить связь</h3>
    <input type="text" id="sourceNode" placeholder="Источник">
    <input type="text" id="targetNode" placeholder="Цель">
    <input type="number" id="linkWeight" placeholder="Вес" value="1" style="width:60px;">
    <button onclick="addLink()">Добавить</button>
  </div>

  <div>
    <h3>Сохранение/Загрузка</h3>
    <button onclick="downloadJSON()">Скачать JSON</button>
    <button onclick="downloadPNG()">Скачать PNG</button>
    <input type="file" id="fileInput" accept=".json">
    <button onclick="loadJSON()">Загрузить JSON</button>
  </div>

  <div>
    <h3>Управление картой</h3>
    <button onclick="resetView()">Сбросить масштаб и центр</button>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<svg></svg>

<script>
let nodes = [];
let links = [];

const svg = d3.select("svg");
const width = window.innerWidth;
const height = window.innerHeight - 120;

// Группа для zoom & pan
const g = svg.append("g");

const tooltip = d3.select("#tooltip");

const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(150))
    .force("charge", d3.forceManyBody().strength(-500))
    .force("center", d3.forceCenter(width / 2, height / 2));

const linkGroup = g.append("g").attr("stroke", "#888").attr("stroke-opacity", 0.6);
const nodeGroup = g.append("g").attr("stroke-width", 1.5);

// Zoom & Pan
const zoom = d3.zoom()
    .scaleExtent([0.1, 5])
    .on("zoom", (event) => { g.attr("transform", event.transform); });
svg.call(zoom);

// ----------------- Update -----------------
function update() {
    // LINKS
    const link = linkGroup.selectAll("line").data(links);
    link.join("line").attr("stroke-width", d => Math.sqrt(d.weight))
        .attr("stroke", "#888");

    // NODES
    const node = nodeGroup.selectAll("circle").data(nodes, d => d.id);
    node.join("circle")
        .attr("r", 20)
        .attr("fill", d => d3.schemeCategory10[d.group?.length % 10])
        .call(drag(simulation))
        .on("mouseover", (event,d) => {
            tooltip.style("opacity",1).html(`Название: ${d.id}<br>Группа: ${d.group || '—'}`);
        })
        .on("mousemove", (event) => {
            tooltip.style("left",(event.pageX+10)+"px").style("top",(event.pageY+10)+"px");
        })
        .on("mouseout", () => tooltip.style("opacity",0));

    // LABELS
    const labels = nodeGroup.selectAll("text").data(nodes, d => d.id);
    labels.join("text")
        .text(d => d.id)
        .attr("text-anchor", "middle")
        .attr("dy", -25)
        .attr("fill", "#fff")
        .attr("font-size", "10px")
        .attr("font-weight", "300")
        .attr("pointer-events", "none");

    simulation.nodes(nodes).on("tick", ticked);
    simulation.force("link").links(links);
    simulation.alpha(1).restart();
}

// ----------------- Tick -----------------
function ticked() {
    linkGroup.selectAll("line")
        .attr("x1", d => d.source.x)
        .attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x)
        .attr("y2", d => d.target.y);

    nodeGroup.selectAll("circle")
        .attr("cx", d => d.x)
        .attr("cy", d => d.y);

    nodeGroup.selectAll("text")
        .attr("x", d => d.x)
        .attr("y", d => d.y - 25);
}

// ----------------- Drag -----------------
function drag(simulation) {
  function dragstarted(event,d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragged(event,d) { d.fx = event.x; d.fy = event.y; }
  function dragended(event,d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
  return d3.drag().on("start",dragstarted).on("drag",dragged).on("end",dragended);
}

// ----------------- Nodes & Links -----------------
function addNode() {
    const name = document.getElementById("nodeName").value.trim();
    const group = document.getElementById("nodeGroup").value.trim();
    if(name && !nodes.find(n => n.id===name)) {
        nodes.push({id:name, group:group});
        update();
    }
}
function deleteNode() {
    const name = document.getElementById("deleteNodeName").value.trim();
    if(!name) return;
    nodes = nodes.filter(n => n.id!==name);
    links = links.filter(l => l.source.id!==name && l.target.id!==name);
    update();
}
function addLink() {
    const source = document.getElementById("sourceNode").value.trim();
    const target = document.getElementById("targetNode").value.trim();
    const weight = parseFloat(document.getElementById("linkWeight").value);
    if(source && target && nodes.find(n=>n.id===source) && nodes.find(n=>n.id===target)){
        links.push({source:source, target:target, weight:weight});
        update();
    }
}

// ----------------- Download JSON -----------------
function downloadJSON(){
    const dataStr = JSON.stringify({nodes:nodes, links:links},null,2);
    const blob = new Blob([dataStr], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href=url; a.download="map.json"; a.click();
    URL.revokeObjectURL(url);
}

// ----------------- Load JSON -----------------
function loadJSON(){
    const fileInput = document.getElementById("fileInput");
    if(fileInput.files.length===0) return;
    const reader = new FileReader();
    reader.onload = function(e){
        try{
            const data = JSON.parse(e.target.result);
            nodes = data.nodes||[];
            links = data.links||[];
            resetView();
            update();
        } catch(err){
            alert("Ошибка загрузки файла: "+err);
        }
    };
    reader.readAsText(fileInput.files[0]);
}

// ----------------- Download PNG -----------------
function downloadPNG(){
    const serializer = new XMLSerializer();
    const cloneSvg = svg.node().cloneNode(true);

    // убираем zoom transform
    const cloneG = cloneSvg.querySelector("g");
    cloneG.removeAttribute("transform");

    const svgString = serializer.serializeToString(cloneSvg);
    const canvas = document.createElement("canvas");
    canvas.width = svgNode.clientWidth;
    canvas.height = svgNode.clientHeight;
    const ctx = canvas.getContext("2d");
    const img = new Image();
    const svgBlob = new Blob([svgString], {type:"image/svg+xml;charset=utf-8"});
    const url = URL.createObjectURL(svgBlob);
    img.onload=function(){
        ctx.fillStyle="#121212";
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0);
        URL.revokeObjectURL(url);
        const pngLink=document.createElement("a");
        pngLink.download="map.png";
        pngLink.href=canvas.toDataURL("image/png");
        pngLink.click();
    }
    img.src=url;
}

// ----------------- Reset View -----------------
function resetView(){
    svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
}

// ----------------- Resize -----------------
window.addEventListener("resize",()=>{
    svg.attr("width",window.innerWidth).attr("height",window.innerHeight-120);
    simulation.force("center",d3.forceCenter(window.innerWidth/2,(window.innerHeight-120)/2));
    simulation.alpha(1).restart();
});
</script>
</body>
</html>
