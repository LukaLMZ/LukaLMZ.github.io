<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Интерактивная карта</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body { font-family: Arial, sans-serif; margin:0; padding:0; overflow:hidden; }
svg { width:100vw; height:100vh; display:block; }

#menuButton {
  position:absolute; top:15px; left:15px;
  background:#3b3b3b; border:none; color:#fff;
  padding:10px 15px; border-radius:5px; cursor:pointer; z-index:10;
}
#menuButton:hover { background:#555; }

#menu {
  position:absolute; top:50px; left:50px;
  padding:20px; border-radius:8px;
  display:none; flex-direction:column; gap:10px; max-width:350px; z-index:10;
}
#menu h3 { margin:5px 0; }
#menu input, #menu button, #menu select { padding:5px; border-radius:4px; border:none; }
#menu button { cursor:pointer; }
.tooltip { position:absolute; background:#333; color:#fff; padding:4px 8px; border-radius:4px; font-size:12px; pointer-events:none; opacity:0; transition:0.2s; }
.highlight { stroke:#ff0 !important; stroke-width:3px !important; }
</style>
</head>
<body>

<button id="menuButton" onclick="toggleMenu()">☰ Меню</button>

<div id="menu">
  <button onclick="toggleMenu()">Закрыть</button>

  <div>
    <h3>Добавить узел</h3>
    <input type="text" id="nodeName" placeholder="Название узла">
    <input type="text" id="nodeGroup" placeholder="Группа">
    <button onclick="addNode()">Добавить</button>
  </div>

  <div>
    <h3>Удалить узел</h3>
    <input type="text" id="deleteNodeName" placeholder="Название узла">
    <button onclick="deleteNode()">Удалить</button>
  </div>

  <div>
    <h3>Добавить связь</h3>
    <input type="text" id="sourceNode" placeholder="Источник">
    <input type="text" id="targetNode" placeholder="Цель">
    <input type="number" id="linkWeight" placeholder="Вес" value="1" style="width:60px;">
    <button onclick="addLink()">Добавить</button>
  </div>

  <div>
    <h3>Поиск узла</h3>
    <input type="text" id="searchNode" placeholder="Название узла">
    <button onclick="searchNode()">Найти</button>
  </div>

  <div>
    <h3>Сохранение / Загрузка</h3>
    <button onclick="downloadJSON()">Скачать JSON</button>
    <button onclick="downloadPNG()">Скачать PNG</button>
    <input type="file" id="fileInput" accept=".json">
    <button onclick="loadJSON()">Загрузить JSON</button>
  </div>

  <div>
    <h3>Управление картой</h3>
    <button onclick="resetView()">Сбросить масштаб и центр</button>
    <button onclick="toggleTheme()">Сменить тему</button>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>
<svg></svg>

<script>
let nodes = [], links = [];
let darkTheme = true;

const svg = d3.select("svg");
const width = window.innerWidth, height = window.innerHeight;
const g = svg.append("g");
const tooltip = d3.select("#tooltip");

// ---------- Загрузка из localStorage ----------
const savedData = localStorage.getItem('mapData');
if(savedData){
    try{
        const data = JSON.parse(savedData);
        nodes = data.nodes || [];
        links = data.links || [];
        darkTheme = data.darkTheme ?? true;
    } catch(e){ console.warn("Ошибка загрузки сохраненной сессии", e); }
}

const simulation = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d=>d.id).distance(150))
    .force("charge", d3.forceManyBody().strength(-500))
    .force("center", d3.forceCenter(width/2, height/2));

const linkGroup = g.append("g").attr("stroke-opacity",0.6);
const nodeGroup = g.append("g");

const zoom = d3.zoom().scaleExtent([0.1,5]).on("zoom", e=>g.attr("transform", e.transform));
svg.call(zoom);

// ---------- Меню ----------
function toggleMenu(){
    const menu = document.getElementById("menu");
    menu.style.display = (menu.style.display==="flex") ? "none" : "flex";
}

function updateMenuTheme(){
    const bgColor = darkTheme ? "#1f1f1f" : "#f0f0f0";
    const textColor = darkTheme ? "#fff" : "#000";
    const inputBg = darkTheme ? "#333" : "#fff";
    const inputColor = darkTheme ? "#fff" : "#000";
    const buttonBg = darkTheme ? "#3b3b3b" : "#ddd";
    const buttonHover = darkTheme ? "#555" : "#bbb";

    const menu = document.getElementById("menu");
    menu.style.backgroundColor = bgColor;
    menu.style.color = textColor;

    menu.querySelectorAll("input").forEach(el => {
        el.style.backgroundColor = inputBg;
        el.style.color = inputColor;
        el.style.border = darkTheme ? "none" : "1px solid #aaa";
    });
    menu.querySelectorAll("button").forEach(el => {
        el.style.backgroundColor = buttonBg;
        el.style.color = textColor;
        el.onmouseover = () => el.style.backgroundColor = buttonHover;
        el.onmouseout = () => el.style.backgroundColor = buttonBg;
    });
}

// ---------- Узлы и связи ----------
function addNode(){
    const name=document.getElementById("nodeName").value.trim();
    const group=document.getElementById("nodeGroup").value.trim();
    if(!name || nodes.find(n=>n.id===name)) return;
    nodes.push({id:name, group:group, x:width/2+Math.random()*100-50, y:height/2+Math.random()*100-50});
    saveSession(); update();
}
function deleteNode(){
    const name=document.getElementById("deleteNodeName").value.trim();
    nodes=nodes.filter(n=>n.id!==name);
    links=links.filter(l=>l.source.id!==name && l.target.id!==name);
    saveSession(); update();
}
function addLink(){
    const source=document.getElementById("sourceNode").value.trim();
    const target=document.getElementById("targetNode").value.trim();
    const weight=parseFloat(document.getElementById("linkWeight").value);
    if(!source || !target) return;
    const sNode=nodes.find(n=>n.id===source), tNode=nodes.find(n=>n.id===target);
    if(!sNode || !tNode) return;
    links.push({source:sNode, target:tNode, weight:weight});
    saveSession(); update();
}

// ---------- Поиск с центрированием ----------
function searchNode(){
    const name=document.getElementById("searchNode").value.trim();
    if(!name) return;
    const node=nodeGroup.selectAll("circle").filter(d=>d.id===name);
    if(!node.empty()){
        simulation.alpha(1).restart();
        const nodeData = node.datum();
        const transform=d3.zoomTransform(svg.node());
        const scale = transform.k;
        const x = width/2 - nodeData.x*scale;
        const y = height/2 - nodeData.y*scale;
        svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity.translate(x,y).scale(scale));
        node.classed("highlight",true);
        setTimeout(()=>node.classed("highlight",false),2000);
    }
}

// ---------- Темная / светлая тема ----------
function toggleTheme(){
    darkTheme=!darkTheme;
    svg.style("background-color", darkTheme ? "#121212" : "#f0f0f0");
    nodeGroup.selectAll("text").attr("fill", darkTheme ? "#fff" : "#000");
    linkGroup.selectAll("line").attr("stroke", darkTheme ? "#888" : "#555");
    updateMenuTheme();
    saveSession();
}

// ---------- Обновление ----------
function update(){
    const color=d3.scaleOrdinal(d3.schemeCategory10);

    const link=linkGroup.selectAll("line").data(links);
    link.join("line")
        .attr("stroke-width", d=>Math.sqrt(d.weight))
        .on("mouseover", (event,d)=>tooltip.style("opacity",1).html(`${d.source.id} → ${d.target.id} (Вес: ${d.weight})`))
        .on("mousemove", (event)=>tooltip.style("left",(event.pageX+10)+"px").style("top",(event.pageY+10)+"px"))
        .on("mouseout", ()=>tooltip.style("opacity",0))
        .attr("stroke", darkTheme?"#888":"#555");

    const node=nodeGroup.selectAll("circle").data(nodes, d=>d.id);
    node.join(enter=>{
        const c=enter.append("circle")
            .attr("r",0)
            .attr("fill", d=>color(d.group))
            .call(drag(simulation))
            .on("mouseover", (event,d)=>tooltip.style("opacity",1).html(`Название: ${d.id}<br>Группа: ${d.group || '—'}`))
            .on("mousemove", (event)=>tooltip.style("left",(event.pageX+10)+"px").style("top",(event.pageY+10)+"px"))
            .on("mouseout", ()=>tooltip.style("opacity",0));
        c.transition().duration(500).attr("r",20);
        return c;
    }).attr("fill", d=>color(d.group));

    const labels=nodeGroup.selectAll("text").data(nodes, d=>d.id);
    labels.join(enter=>enter.append("text").text(d=>d.id)
        .attr("text-anchor","middle")
        .attr("dy",-25)
        .attr("fill", darkTheme?"#fff":"#000")
        .attr("font-size","10px")
        .attr("font-weight","300")
        .attr("pointer-events","none"));

    simulation.nodes(nodes).on("tick", ticked);
    simulation.force("link").links(links);
    simulation.alpha(1).restart();
}

// ---------- Tick с масштабированием текста ----------
function ticked(){
    linkGroup.selectAll("line")
        .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
        .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
    nodeGroup.selectAll("circle").attr("cx",d=>d.x).attr("cy",d=>d.y);
    nodeGroup.selectAll("text")
        .attr("x",d=>d.x)
        .attr("y",d=>d.y-25)
        .attr("font-size", 10 / d3.zoomTransform(svg.node()).k);
}

// ---------- Drag ----------
function drag(sim){
    function start(event,d){if(!event.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y;}
    function dragged(event,d){d.fx=event.x; d.fy=event.y;}
    function end(event,d){if(!event.active) sim.alphaTarget(0); d.fx=null; d.fy=null;}
    return d3.drag().on("start",start).on("drag",dragged).on("end",end);
}

// ---------- JSON / PNG ----------
function downloadJSON(){const dataStr=JSON.stringify({nodes:nodes,links:links},null,2); const blob=new Blob([dataStr],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="map.json"; a.click();}
function loadJSON(){const fileInput=document.getElementById("fileInput"); if(fileInput.files.length===0) return; const reader=new FileReader(); reader.onload=function(e){try{const data=JSON.parse(e.target.result); nodes=data.nodes||[]; links=data.links||[]; resetView(); saveSession(); update();}catch(err){alert("Ошибка загрузки файла:"+err);}}; reader.readAsText(fileInput.files[0]);}
function downloadPNG(){const serializer=new XMLSerializer(); const cloneSvg=svg.node().cloneNode(true); cloneSvg.querySelector("g").removeAttribute("transform"); const svgString=serializer.serializeToString(cloneSvg); const canvas=document.createElement("canvas"); canvas.width=svg.clientWidth; canvas.height=svg.clientHeight; const ctx=canvas.getContext("2d"); const img=new Image(); const svgBlob=new Blob([svgString],{type:"image/svg+xml;charset=utf-8"}); const url=URL.createObjectURL(svgBlob); img.onload=function(){ctx.fillStyle=darkTheme?"#121212":"#f0f0f0"; ctx.fillRect(0,0,canvas.width, canvas.height); ctx.drawImage(img,0,0); URL.revokeObjectURL(url); const a=document.createElement("a"); a.download="map.png"; a.href=canvas.toDataURL("image/png"); a.click();}; img.src=url;}

// ---------- Управление видом ----------
function resetView(){ svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity); }

// ---------- Resize ----------
window.addEventListener("resize",()=>{
    svg.attr("width",window.innerWidth).attr("height",window.innerHeight);
    simulation.force("center",d3.forceCenter(window.innerWidth/2, window.innerHeight/2));
    simulation.alpha(1).restart();
});

// ---------- Сохранение сессии ----------
function saveSession(){
    const data={nodes:nodes, links:links, darkTheme:darkTheme};
    localStorage.setItem('mapData', JSON.stringify(data));
}

// ---------- Инициализация ----------
svg.style("background-color", darkTheme ? "#121212" : "#f0f0f0");
updateMenuTheme();
update();
</script>
</body>
</html>
