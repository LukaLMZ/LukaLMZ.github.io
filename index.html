<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Режим Древа</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
body{margin:0;overflow:hidden;font-family:Arial,sans-serif;background:#121212;color:#fff;}
svg{width:100vw;height:100vh;display:block;cursor:default;}
#menuButton{position:absolute;top:15px;left:15px;background:#333;color:#fff;border:none;padding:10px 15px;border-radius:5px;cursor:pointer;z-index:10;}
#menuButton:hover{background:#555;}
#menu{position:absolute;top:50px;left:15px;padding:20px;border-radius:8px;display:none;flex-direction:column;gap:10px;max-width:250px;z-index:10;max-height:70vh;overflow-y:auto;background:#1f1f1f;}
#menu button{cursor:pointer;padding:5px;border:none;border-radius:4px;}
.box{fill:#333;stroke:#888;stroke-width:2;cursor:pointer;}
.box.selected{stroke:#00ffff;stroke-width:3;}
.line{stroke:#888;stroke-width:2;}
text{fill:#fff;text-anchor:middle;pointer-events:none;font-size:14px;}
</style>
</head>
<body>
<button id="menuButton" onclick="toggleMenu()">☰ Меню</button>
<div id="menu">
<button onclick="addBox()">Добавить бокс</button>
<button onclick="deleteBox()">Удалить выбранный бокс</button>
</div>
<svg></svg>

<script>
const svg=d3.select("svg"), width=window.innerWidth, height=window.innerHeight;
const g=svg.append("g");
let treeNodes=[], treeLinks=[], selectedBox=null, dragLine=null, rightDragBox=null;

// Меню
function toggleMenu(){const menu=document.getElementById("menu");menu.style.display=(menu.style.display==="flex")?"none":"flex";}

// Добавление/удаление боксов
function addBox(){const box={id:"box"+(treeNodes.length+1),x:width/2+Math.random()*100-50,y:height/2+Math.random()*100-50,w:120,h:50,text:""}; treeNodes.push(box); update();}
function deleteBox(){if(!selectedBox)return; treeNodes=treeNodes.filter(b=>b!==selectedBox); treeLinks=treeLinks.filter(l=>l.source!==selectedBox && l.target!==selectedBox); selectedBox=null; update();}

// Создание связи мышкой
function startRightLink(d){rightDragBox=d; dragLine={x1:d.x,y1:d.y,x2:d.x,y2:d.y,source:d}; update();}
function moveRightLink(event){if(dragLine){const pt=d3.pointer(event); dragLine.x2=pt[0]; dragLine.y2=pt[1]; update();}}
function endRightLink(d){if(dragLine && dragLine.source!==d){treeLinks.push({source:dragLine.source,target:d});} dragLine=null; rightDragBox=null; update();}

// Обновление визуализации
const nodeGroup=g.append("g"), linkGroup=g.append("g");
function update(){
linkGroup.selectAll("*").remove(); nodeGroup.selectAll("*").remove();

// связи
treeLinks.forEach(l=>linkGroup.append("line").attr("class","line").attr("x1",l.source.x).attr("y1",l.source.y).attr("x2",l.target.x).attr("y2",l.target.y));

// боксы
treeNodes.forEach(b=>{
const gNode=nodeGroup.append("g").call(d3.drag().on("drag",e=>{b.x=e.x;b.y=e.y; update();}));
gNode.append("rect").attr("class","box").classed("selected",b===selectedBox).attr("x",b.x-b.w/2).attr("y",b.y-b.h/2).attr("width",b.w).attr("height",b.h)
.on("mousedown",(event)=>{if(event.button===2){startRightLink(b);}else{selectedBox=b; update();}});

gNode.append("text").text(b.text).attr("x",b.x).attr("y",b.y+5);
gNode.on("dblclick",()=>{const t=prompt("Введите текст:",b.text); if(t!==null){b.text=t; update();}});
});

// линия drag
if(dragLine){linkGroup.append("line").attr("x1",dragLine.x1).attr("y1",dragLine.y1).attr("x2",dragLine.x2).attr("y2",dragLine.y2).attr("stroke","#00ffff").attr("stroke-width",2);}
}

// Drag-события для линии
svg.on("mousemove",moveRightLink).on("mouseup",()=>{if(dragLine && rightDragBox){endRightLink(selectedBox);}});

// Отключение контекстного меню
svg.on("contextmenu",event=>event.preventDefault());

update();
</script>
</body>
</html>
